version: 1
disable_existing_loggers: false

formatters:
  console:
    format: "%(levelname)-8s %(message)s"
  detailed:
    format: "%(asctime)s %(levelname)-8s %(name)s %(funcName)s:%(lineno)d %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stderr
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: "{log_dir}/rsc.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  rs_collector:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  paramiko:
    level: WARNING
    handlers: [file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
